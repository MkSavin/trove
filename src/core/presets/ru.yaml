# trove store config; see the Config section of the trove README.
regulation: 1
language: ru
sync: off

roots: {}

folders:
  audits: { prefix: AUDIT_, types: [audit, resolved] }
  specs: { prefix: SPEC_, types: [spec] }
  plans: { prefix: PLAN_, types: [plan] }
  research: { prefix: [RESEARCH_, INCIDENT_, STUDY_], types: [research, incident, study] }
  external: { prefix: EXTERNAL_, types: [external] }
  prompts: { prefix: PROMPT_, types: [prompt] }
  summaries: { prefix: SUMMARY_, types: [summary] }

statuses:
  open: открыт
  in-progress: в работе
  not-started: не начат
  closed: закрыт
  current: актуален
  archived: архив

labels:
  statusLine: Статус документа
  checked: Сверено
  ledger: Реестр открытых пунктов
  closedLedger: Закрытые пункты
  count: пунктов
  summaryCounts: По приоритетам
  summaryItems: Открытые пункты
  summaryDocuments: Документы в работе
  branch: ветка
  lastCommit: последний коммит
  ownCommits: свои
  localAhead: локальная впереди
  localDiverged: локальная разошлась
  change: изменение
  changeClosed: закрыт
  changeAdded: добавлен
  changeMoved: перенесён
  noChanges: изменений нет
  baseMoved: "база сдвинута на {commit} {date}: хранилища ещё не было на {since}"
  week: неделя
  trendOpened: открыто
  trendClosed: закрыто
  trendMoved: перенесено
  trendOpen: открыто на конец
  trendStart: на начало

fields:
  type: required
  status: required
  scope: required
  date: { required: true, format: date }
  checked: { required: true, format: date }
  verify: optional
  owner: optional
  supersedes: { format: refs }
  superseded_by: { format: refs }

types:
  audit:
    purpose: "Находки по существующему коду и реестр того, что осталось исправить. Не для кода, который ещё предстоит написать: это спека или план."
    capabilities: [ledger, series, status-line, freshness]
    closeInto: resolved
    fields:
      slug: required
      resolved: { format: refs }
  resolved:
    purpose: "Закрытые пункты одного аудита с разбором и его рабочие материалы: черновые id, поправки, проверенное и снятое. Открытых пунктов не несёт."
    capabilities: [resolved-of, status-line, freshness]
    initial: current
    fields:
      base: { required: true, format: refs }
  spec: { purpose: "Поведение, которое нужно построить, как договор. Реализована целиком — в архив; как система устроена сейчас, спека не описывает.", statuses: [not-started, in-progress, closed, archived], capabilities: [versions, status-line, freshness], initial: not-started }
  plan: { purpose: "Работа по этапам, у каждого критерий готовности. Сюда же план процесса: раскатки, миграции.", statuses: [not-started, in-progress, closed, archived], capabilities: [status-line, freshness, stages], initial: not-started }
  research: { purpose: "Отчёт о проведённом исследовании: вопрос, что найдено, вывод или рекомендация. Исследование, которое ещё идёт, — это study; работа, которую предстоит сделать, — plan.", capabilities: [status-line, freshness] }
  incident: { purpose: "Разбор одного инцидента или жалобы по логам: хронология, причины, задачи заведены в других документах.", capabilities: [status-line, freshness] }
  study: { purpose: "Исследование, которое идёт или предстоит: вопрос, гипотезы, шаги, что замерить. Ответ оформляется отчётом research.", statuses: [in-progress, closed, archived], capabilities: [status-line, freshness], initial: in-progress }
  external: { purpose: "Присланный извне отчёт, как есть.", capabilities: [status-line, freshness], initial: current }
  prompt:
    purpose: "Крупное задание для ИИ-агента: запускается повторно, правится, передаётся коллегам."
    capabilities: [prompt-body, status-line, freshness]
    statuses: [current, archived]
    fields: { produces: optional, model: optional }
  debt: { purpose: "Что планы обещали от других команд, а в коде этого ещё нет.", capabilities: [status-line, freshness], initial: current }
  risk: { purpose: "Допущения выкаченного кода, которые никто не проверил на живом устройстве.", capabilities: [status-line, freshness], initial: current }
  deferred:
    purpose: "Наша собственная работа, отложенная намеренно: что, почему, откуда пришла и когда к ней вернуться."
    capabilities: [ledger, status-line, freshness]
    initial: current
    ledger:
      id: "DEF-{n}"
      columns:
        - { key: id, label: id, required: true }
        - { key: priority, label: P }
        - { key: owner, label: владелец }
        - { key: status, label: статус, required: true, enum: { deferred: отложено } }
        - { key: what, label: что, required: true }
        - { key: from, label: откуда }
        - { key: why, label: почему }
        - { key: until, label: до }
        - { key: checked, label: сверено }
      open: [deferred]
      closed: { done: сделано, dropped: отказались, moved: перенесено }
      note: "{status} {date}, {commit}"
  summary:
    purpose: "Срез хранилища на дату: сгенерированные блоки статуса плюс написанный анализ. Создаётся `trove summary new <вид>`; архивируется, когда его сменяет новый."
    capabilities: [status-line, freshness]
    initial: current
    freshness: 14
    fields: { kind: optional }
  backlog: { purpose: "Собирается из других документов, руками не правится.", capabilities: [generated, status-line] }

ledger:
  id: "{slug}-{n}"
  columns:
    - { key: id, label: id, required: true }
    - { key: priority, label: P, required: true }
    - { key: module, label: модуль }
    - { key: owner, label: владелец, required: true }
    - { key: status, label: статус, required: true, enum: { open: открыто, deferred: отложено } }
    - { key: what, label: что осталось, required: true }
    - { key: blocked_by, label: ждёт }
    - { key: until, label: до }
    - { key: checked, label: сверено }
  open: [open]
  closed: { fixed: исправлено, dropped: снято, moved: перенесено }
  note: "{status} {date}, {commit}"

lifecycle:
  audit:
    - { when: no-open-items, place: archive }
    - { when: has-open-items, place: work }
  spec:
    - { when: { status: closed }, place: archive }
  plan:
    - { when: { status: closed }, place: archive }
  summary:
    - { when: { status: archived }, place: archive }
  study:
    - { when: { status: closed }, place: archive }

freshness: { default: 60 }

rules: {}

reports:
  backlog:
    output: BACKLOG.md
    type: backlog
    status: current
    title: BACKLOG — что осталось по всем аудитам
    scope: все аудиты
    note: Собран из реестров аудитов, руками не правится.
    intro: >-
      Файл генерируется: `trove report backlog`. Закрыть пункт: `trove item close <id>`.
    sections:
      - from: items
        where: { type: audit, status: [open, deferred] }
        groupBy: owner
        sort: [priority, id]
        columns: [id, priority, module, status, what, { key: document, label: аудит }]
      - from: documents
        title: Спеки и планы, не доведённые до конца
        where: { type: [spec, plan], place: work }
        sort: [type, path]
        columns:
          - { key: document, label: документ }
          - { key: status, label: статус }
          - { key: verify, label: как проверить, empty: "" }

  prompts-index:
    output: prompts/README.md
    type: backlog
    status: current
    title: Промпты — индекс
    scope: prompts/
    note: Собран из шапок промптов, руками не правится.
    intro: "Файл генерируется: `trove report prompts-index`. Текст задания: `trove prompt <файл> [--copy]`."
    sections:
      - from: documents
        where: { type: prompt, place: work }
        sort: [path]
        columns:
          - { key: document, label: промпт }
          - { key: scope, label: область }
          - { key: model, label: для кого }
          - { key: produces, label: рождает }
          - { key: checked, label: сверено }

summaries:
  all:
    title: Сводка — что открыто
